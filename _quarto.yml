project:
  type: book
  output-dir: _book

execute:
  enabled: true
  freeze: auto

book:
  title: "Introduction to Data Science"
  subtitle: "Course Notes"
  author:
    - name: Jun Yan
      url: https://statcomp.org
  site-url: https://statds.github.io/ids-book
  repo-url: https://github.com/statds/ids-book
  repo-actions:
    - edit
    - issue
  chapters:
    - index.qmd
    - 01-intro.qmd
    - 02-git.qmd
    - 03-quarto.qmd
    - 04-python.qmd
    - 05-formulation.qmd
    - 06-wrangling.qmd
    - 07-eda.qmd
    - 08-visualization.qmd
    - 09-modeling.qmd
    - 10-ethics.qmd

format:
  html:
    theme: cosmo
    html-math-method: mathjax

bibliography: references.bib

csl: apa.csl

crossref:
  exr-title: ""
